name: Collect Ladder Meta

on:
  schedule:
    # 매일 21:00 UTC = 06:00 KST
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      players:
        description: '표본 선수 수 (티어별 분배)'
        default: '60'
        required: false
      matches_per_player:
        description: '선수당 최근 매치 수'
        default: '8'
        required: false
      max_matches:
        description: '총 수집 매치 상한'
        default: '400'
        required: false
      dry_run:
        description: 'true 이면 커밋/푸시를 하지 않습니다'
        default: 'false'
        required: false

permissions:
  contents: write

concurrency:
  group: collect-ladder
  cancel-in-progress: false

jobs:
  collect:
    name: 래더 표본 수집 → lib/metaStats.json
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Riot key
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          if [ -z "$RIOT_API_KEY" ]; then
            echo "::error title=RIOT_API_KEY missing::Repository secret RIOT_API_KEY 를 설정하세요."
            exit 1
          fi

      - name: Collect ladder matches
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          RIOT_REGION: asia
          RIOT_PLATFORM: kr
          PLAYERS: ${{ github.event.inputs.players || '60' }}
          MATCHES_PER_PLAYER: ${{ github.event.inputs.matches_per_player || '8' }}
          MAX_MATCHES: ${{ github.event.inputs.max_matches || '400' }}
        run: npm run collect:ladder

      - name: Validate collected data
        run: npm run meta:check

      - name: Collect ladder boards
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          RIOT_REGION: asia
          RIOT_PLATFORM: kr
          PLAYERS: ${{ github.event.inputs.players || '60' }}
          MATCHES_PER_PLAYER: ${{ github.event.inputs.matches_per_player || '8' }}
          MAX_MATCHES: ${{ github.event.inputs.max_matches || '400' }}
        run: npm run collect:boards

      # 공식 패치 노트(키 불필요). 덱 빌드의 패치 분리가 이 파일을 쓰므로 덱 빌드 전에 받는다. 실패해도 계속
      - name: Collect patch notes
        continue-on-error: true
        run: npm run collect:patches

      - name: Rebuild decks from stats
        run: |
          npm run build:decks
          npm run decks:check

      - name: Show rank delta summary
        run: npm run meta:summary

      - name: Commit updated data
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- lib/metaStats.json lib/decksData.json lib/patchNotes.json; then
            echo "변경 사항이 없어 커밋하지 않습니다."
            exit 0
          fi
          git add lib/metaStats.json lib/decksData.json lib/patchNotes.json
          git commit -m "chore(meta): 래더 표본·덱 자동 갱신 ($(date -u +%Y-%m-%d))"
          git push
