name: Collect Ladder Meta

on:
  schedule:
    # 매일 21:00 UTC = 06:00 KST. 하루 1회만 — DB 수집(collect-db, 매시 17분)이 같은 Riot 키를 쓰므로 이 시간만 비워 둔다.
    # 보드는 실행마다 새로 모으므로(data/ladderBoards.json 미커밋) 실행을 늘려도 표본은 커지지 않는다. 표본은 1500판 상한으로 키운다
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      players:
        description: '표본 선수 수 (티어별 분배)'
        default: '60'
        required: false
      matches_per_player:
        description: '선수당 최근 매치 수'
        default: '8'
        required: false
      max_matches:
        description: '총 수집 매치 상한'
        default: '400'
        required: false
      board_matches:
        description: '덱 보드 수집 판 수 상한 (상위 덱 300판+ 목표)'
        default: '1500'
        required: false
      board_players:
        description: '덱 보드 표본 선수 수 (챌린저 → 그마 → 마스터 LP 순)'
        default: '160'
        required: false
      dry_run:
        description: 'true 이면 커밋/푸시를 하지 않습니다'
        default: 'false'
        required: false

permissions:
  contents: write

concurrency:
  group: collect-ladder
  cancel-in-progress: false

jobs:
  collect:
    name: 래더 표본 수집 → lib/metaStats.json
    runs-on: ubuntu-latest
    # 보드 1500판 × 1.25초(개발 키 한도) ≈ 32분 + 래더 표본 — 여유 있게
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 경제·템포·완성도 축 기준선 (탈락 스테이지·캐리별 레벨/보드 가치 중앙값) — Supabase 원본 보드(마스터+)에서.
      # 래더 수집과 무관해 먼저 돈다. 시크릿이 없거나 실패하면 이전 lib/gameBaselines.json 그대로 계속
      - name: Build level/board-value baselines
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build:baselines -- --write

      - name: Check Riot key
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          if [ -z "$RIOT_API_KEY" ]; then
            echo "::error title=RIOT_API_KEY missing::Repository secret RIOT_API_KEY 를 설정하세요."
            exit 1
          fi

      - name: Collect ladder matches
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          RIOT_REGION: asia
          RIOT_PLATFORM: kr
          PLAYERS: ${{ github.event.inputs.players || '60' }}
          MATCHES_PER_PLAYER: ${{ github.event.inputs.matches_per_player || '8' }}
          MAX_MATCHES: ${{ github.event.inputs.max_matches || '400' }}
        run: npm run collect:ladder

      - name: Validate collected data
        run: npm run meta:check

      - name: Collect ladder boards
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          RIOT_REGION: asia
          RIOT_PLATFORM: kr
          # 예전엔 래더 표본과 같은 400판 상한이라 덱 표본이 292판(상위 덱 155판)에 그쳤다 — 보드 수집 기본값(160명 × 15판, 1500판)을 쓴다
          PLAYERS: ${{ github.event.inputs.board_players || '160' }}
          MATCHES_PER_PLAYER: '15'
          MAX_MATCHES: ${{ github.event.inputs.board_matches || '1500' }}
          # 1500판 × 1.25초 ≈ 31분. 다음 DB 수집(22:17 UTC, 같은 키) 전에 끝나게 판 수집은 35분에서 멈춘다
          MAX_MINUTES: '35'
        run: npm run collect:boards

      # 공식 패치 노트(키 불필요). 덱 빌드의 패치 분리가 이 파일을 쓰므로 덱 빌드 전에 받는다. 실패해도 계속
      - name: Collect patch notes
        continue-on-error: true
        run: npm run collect:patches

      - name: Rebuild decks from stats
        run: |
          npm run build:decks
          npm run decks:check

      # 기물 빌드(아이템 3개 세트) JSON 폴백 — 덱과 같은 래더 보드에서. DB 경로는 수집기(collect:db)가 stat_unit_build 로 만든다
      - name: Build unit builds
        run: npm run build:builds

      - name: Show rank delta summary
        run: npm run meta:summary

      # 기준선이 바뀌면 6축 경제·템포 점수가 ±1 움직여 data/axesSnapshot.json 이 낡는다. 봇 푸시는 CI 를 돌리지 않아
      # main 이 조용히 깨지고 다음 PR 이 test:axes 에서 실패한다 (2026-10-27, 8616eea). 점수가 움직였을 때만 다시 찍는다
      # (--update 는 generatedAt 을 매번 바꿔 열린 PR 과 충돌하므로). 공식 버전(axisConfig.json version)은 그대로라
      # 공식을 바꾼 PR 은 갱신된 스냅샷 기준으로 계속 잡힌다. 불변식이 깨지면 --update 도 실패해 커밋하지 않는다
      - name: Refresh 6-axis snapshot
        run: |
          if npm run test:axes; then
            echo "6축 점수 변화 없음 — 스냅샷 유지"
          else
            echo "::notice title=6-axis snapshot::기준선 갱신으로 6축 점수가 움직여 data/axesSnapshot.json 을 다시 찍습니다."
            npm run test:axes:update
          fi

      - name: Commit updated data
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- lib/metaStats.json lib/decksData.json lib/unitBuilds.json lib/patchNotes.json lib/gameBaselines.json data/axesSnapshot.json; then
            echo "변경 사항이 없어 커밋하지 않습니다."
            exit 0
          fi
          git add lib/metaStats.json lib/decksData.json lib/unitBuilds.json lib/patchNotes.json lib/gameBaselines.json data/axesSnapshot.json
          git commit -m "chore(meta): 래더 표본·덱 자동 갱신 ($(date -u +%Y-%m-%d))"
          git push
