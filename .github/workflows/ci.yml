name: CI

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / Typecheck / Data / Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Meta data sanity
        run: npm run meta:check

      - name: Deck data sanity
        run: npm run decks:check

      - name: 6-axis scoring regression
        run: npm run test:axes

      - name: DB collector tests
        run: npm run test:collect

      - name: Rollup / deck cluster tests
        run: npm run test:rollup

      - name: Build
        run: npm run build
        env:
          # 빌드 검증용 더미 값 (실제 키는 Vercel 환경변수로 관리)
          RIOT_API_KEY: ""
          RIOT_REGION: asia
          DEEPSEEK_API_KEY: ""
          GEMINI_API_KEY: ""

      - name: Smoke test (SSR routes)
        run: |
          set -e
          npm run start -- -p 3100 > smoke.log 2>&1 &
          trap 'pkill -f "next start" || true' EXIT

          ready=0
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:3100/api/health > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "::error::next start 가 90초 안에 뜨지 않았습니다."
            cat smoke.log
            exit 1
          fi

          for path in / /rank /meta /pro /terms /privacy /manifest.webmanifest /icon.svg /icons/icon-192.png /robots.txt /sitemap.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3100$path")
            echo "$path -> $code"
            test "$code" = "200"
          done

          deck=$(curl -s http://127.0.0.1:3100/sitemap.xml | grep -oE '/deck/[A-Za-z0-9_-]+' | head -1)
          if [ -z "$deck" ]; then
            echo "::error::sitemap 에 덱 URL 이 없습니다."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3100$deck")
          echo "$deck -> $code"
          test "$code" = "200"

          echo "smoke ok"

  eval:
    name: AI Reliability Eval
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check LLM secret
        id: keycheck
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=AI Eval skipped::DEEPSEEK_API_KEY secret 이 없어 신뢰성 평가를 건너뜁니다."
          fi

      - name: Build app
        if: steps.keycheck.outputs.present == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RIOT_API_KEY: ""
          RIOT_REGION: asia
          GEMINI_API_KEY: ""
        run: npm run build

      - name: Start server
        if: steps.keycheck.outputs.present == 'true'
        run: |
          nohup npm run start > server.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3000/api/tft/meta > /dev/null; then
              echo "server ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::서버가 90초 안에 뜨지 않았습니다."
          cat server.log
          exit 1

      - name: Run eval gate
        if: steps.keycheck.outputs.present == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run eval:reports -- --runs 2

      - name: Upload eval report
        if: always() && steps.keycheck.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            data/evalReport.json
            server.log
          if-no-files-found: warn

      - name: Stop server
        if: always() && steps.keycheck.outputs.present == 'true'
        run: pkill -f "next start" || true

