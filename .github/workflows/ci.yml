name: CI

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint / Typecheck / Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # 빌드 검증용 더미 값 (실제 키는 Vercel 환경변수로 관리)
          RIOT_API_KEY: ""
          RIOT_REGION: asia
          DEEPSEEK_API_KEY: ""
          GEMINI_API_KEY: ""
